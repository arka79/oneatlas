name: oneatlas

services:
  db:
    image: postgres:17-alpine
    container_name: oneatlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oneatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oneatlas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-oneatlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oneatlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  oneatlas_pgdata:
